<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#7CC8F2">
<meta name="description" content="Pinta en el móvil o la tablet los 40 dibujos del libro Los Pintamigos: animales, vehículos y dinosaurios.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.png">
<link rel="apple-touch-icon" href="icono.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Pinta con los Pintamigos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a gallery of the book's 40 drawings by section, and a one-screen paint studio (drawing on top, tools and crayons at the thumb). Single light look on purpose: the paper must stay white. */
:root{
  --sky:#7CC8F2;       /* cover sky */
  --sky-soft:#E4F4FD;
  --ink:#1E3A8A;       /* navy outlines and text */
  --ink-soft:#4A5E9E;
  --red:#E63946;       /* title red */
  --sun:#FFD60A;       /* badge yellow */
  --leaf:#2A9D8F;
  --paper:#FFFFFF;
  --line:#C9DDF0;
  --font-display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:18px;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sky-soft);color:var(--ink);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:10px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Gallery ---------- */
#home{min-height:100%;display:flex;flex-direction:column}
.hero{background:var(--sky);padding-block:22px 26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:-5%;right:-5%;bottom:-38px;height:70px;background:var(--sky-soft);border-radius:50% 50% 0 0}
.hero-in{max-width:1080px;margin:0 auto;position:relative;z-index:1;display:flex;flex-direction:column;gap:6px}
.brand{font-family:var(--font-display);font-weight:800;font-size:clamp(2rem,7vw,3.4rem);line-height:1;color:var(--red);letter-spacing:-.01em;text-shadow:0 3px 0 #fff}
.tag{font-family:var(--font-display);font-weight:600;font-size:clamp(1.1rem,3.6vw,1.45rem);color:var(--ink);margin:0;text-wrap:balance}
.how{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.how span{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.85rem}
main.gal{flex:1;max-width:1080px;width:100%;margin:0 auto;box-sizing:border-box;padding-block:8px 32px;display:flex;flex-direction:column;gap:18px}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:3px solid var(--ink);background:#fff;border-radius:999px;padding:7px 16px;font-family:var(--font-display);font-weight:800;font-size:1.05rem;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.tab small{font-family:var(--font-body);font-weight:800;font-size:.75rem;background:var(--sun);color:var(--ink);border-radius:999px;padding:1px 7px}
.sec h2{font-family:var(--font-display);font-weight:800;font-size:1.45rem;margin:4px 0 10px;display:flex;align-items:baseline;gap:10px}
.sec h2 em{font-style:normal;font-family:var(--font-body);font-size:.85rem;color:var(--ink-soft);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.card{background:#fff;border:3px solid var(--ink);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:left;box-shadow:0 4px 0 var(--ink);transition:transform .12s ease,box-shadow .12s ease;position:relative}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.thumb{aspect-ratio:3/4;width:100%;position:relative;background:#fff;border-bottom:3px solid var(--ink)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.thumb .lines{mix-blend-mode:multiply}
.meta{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.meta b{font-family:var(--font-display);font-weight:800;font-size:1rem;line-height:1.15}
.meta span{font-size:.78rem;color:var(--ink-soft);font-weight:700}
.done{position:absolute;top:8px;right:8px;background:var(--sun);border:2px solid var(--ink);border-radius:999px;font-size:.72rem;font-weight:800;padding:2px 8px;z-index:2}
.foot{max-width:1080px;margin:0 auto;padding-block:18px 28px;color:var(--ink-soft);font-size:.9rem;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;box-sizing:border-box;width:100%}
.foot b{color:var(--ink)}

/* ---------- Studio ---------- */
#studio{position:fixed;inset:0;background:var(--sky-soft);display:flex;flex-direction:column;z-index:5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar{display:flex;align-items:center;gap:10px;padding-block:8px}
.round{width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;box-shadow:0 3px 0 var(--ink)}
.round:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.round svg{width:24px;height:24px}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.ttl b{font-family:var(--font-display);font-weight:800;font-size:1.2rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{font-size:.78rem;font-weight:700;color:var(--ink-soft)}
.stagebox{flex:1;min-height:0;display:grid;place-items:center;padding-block:4px}
.stage{position:relative;background:#fff;border:3px solid var(--ink);border-radius:14px;overflow:hidden;touch-action:none;box-shadow:0 5px 0 var(--ink)}
.stage canvas,.stage img{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage img{mix-blend-mode:multiply;pointer-events:none;user-select:none;-webkit-user-drag:none}
.tools{display:flex;flex-direction:column;gap:10px;padding-block:8px 10px;max-width:760px;width:100%;margin:0 auto;box-sizing:border-box}
.row{display:flex;gap:8px;align-items:center}
.tool{flex:1;min-width:0;height:58px;border-radius:14px;background:#fff;border:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:.74rem;line-height:1;box-shadow:0 3px 0 var(--ink)}
@media (min-width:560px){.tool{flex-direction:row;gap:6px;font-size:.9rem;height:52px}}
.tool svg{width:22px;height:22px;flex:0 0 22px}
.tool[aria-pressed="true"]{background:var(--sun)}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tool[disabled]{opacity:.4}
@media (max-width:330px){.tool .lbl{display:none}}
.pal{display:flex;gap:9px;overflow-x:auto;padding:8px 8px 8px;scrollbar-width:none}
.pal::-webkit-scrollbar{display:none}
.sw{flex:0 0 44px;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);position:relative}
.sw[aria-pressed="true"]{transform:scale(1.12);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink)}
.sizes{display:flex;gap:8px;flex:0 0 auto}
.size{width:44px;height:44px;border-radius:12px;background:#fff;border:3px solid var(--ink);display:grid;place-items:center}
.size i{display:block;border-radius:50%;background:var(--ink)}
.size[aria-pressed="true"]{background:var(--sun)}
.sizes[hidden]{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 48px);text-align:center}
.toast.on{opacity:1}
.confirm{position:fixed;inset:0;background:rgba(30,58,138,.35);display:grid;place-items:center;z-index:15;padding:24px}
.confirm div{background:#fff;border:3px solid var(--ink);border-radius:var(--r);padding:20px;max-width:320px;display:flex;flex-direction:column;gap:14px;text-align:center;box-shadow:0 5px 0 var(--ink)}
.confirm p{margin:0;font-family:var(--font-display);font-weight:800;font-size:1.25rem}
.confirm .row button{flex:1;height:48px;border-radius:12px;border:3px solid var(--ink);font-weight:800}
.confirm .yes{background:var(--red);color:#fff}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="home">
  <header class="hero wrap">
    <div class="hero-in">
      <div class="brand">Los Pintamigos</div>
      <p class="tag">Elige un dibujo de tu libro y píntalo aquí con el dedo.</p>
      <div class="how"><span>1 · Elige un dibujo</span><span>2 · Escoge un color</span><span>3 · Toca para pintar</span></div>
    </div>
  </header>
  <main class="gal wrap">
    <nav class="tabs" role="tablist" aria-label="Secciones del libro" id="tabs"></nav>
    <div id="secs"></div>
  </main>
  <footer class="foot wrap">
    <span>Los mismos 40 dibujos de <b>Los Pintamigos · Libro 1</b>, con su número de página.</span>
    <span>lospintamigos.github.io/colorear</span>
  </footer>
</div>

<div id="studio" hidden>
  <div class="bar wrap">
    <button class="round" id="back" aria-label="Volver a los dibujos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl"><b id="sTitle">Dibujo</b><span id="sPage">Página</span></div>
    <button class="round" id="sound" aria-label="Sonido" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="wave" d="M17 9a4 4 0 010 6"/></svg></button>
    <button class="round" id="save" aria-label="Guardar el dibujo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg></button>
  </div>
  <div class="stagebox wrap" id="stagebox">
    <div class="stage" id="stage">
      <canvas id="paint" width="720" height="960"></canvas>
      <img id="lines" alt="" draggable="false">
    </div>
  </div>
  <div class="tools wrap">
    <div class="row">
      <button class="tool" id="tFill" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M4 12l7-7 8 8-7 7z"/><path d="M19 15s2 2.4 2 3.6a2 2 0 01-4 0c0-1.2 2-3.6 2-3.6z" fill="currentColor"/></svg><span class="lbl">Rellenar</span></button>
      <button class="tool" id="tBrush" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 4L10 14"/><path d="M9 15c-3 0-4 2-4 5 3 0 5-1 5-4z" fill="currentColor"/></svg><span class="lbl">Pincel</span></button>
      <button class="tool" id="tErase" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M3 15l8-8 7 7-5 5H7z"/><path d="M13 19h8"/></svg><span class="lbl">Goma</span></button>
      <button class="tool" id="tUndo" disabled aria-label="Deshacer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7H4V2"/><path d="M4 7a8 8 0 11-1 6"/></svg><span class="lbl">Deshacer</span></button>
      <button class="tool" id="tClear" aria-label="Empezar de nuevo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg><span class="lbl">Borrar</span></button>
    </div>
    <div class="row">
      <div class="sizes" id="sizes" hidden>
        <button class="size" data-s="10" aria-label="Pincel fino" aria-pressed="false"><i style="width:8px;height:8px"></i></button>
        <button class="size" data-s="26" aria-label="Pincel gordo" aria-pressed="true"><i style="width:18px;height:18px"></i></button>
      </div>
      <div class="pal" id="pal" role="group" aria-label="Colores"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<canvas id="confetti" hidden></canvas>

<script>
const BASE = "dibujos/";
const DATA = [{"id": "vaca", "t": "La vaca y el pollito", "p": 7, "s": "a"}, {"id": "cerdito", "t": "El cerdito", "p": 9, "s": "a"}, {"id": "caballo", "t": "El caballo y el potrillo", "p": 11, "s": "a"}, {"id": "oveja", "t": "La oveja", "p": 13, "s": "a"}, {"id": "gato", "t": "El gatito", "p": 15, "s": "a"}, {"id": "perro", "t": "El perrito", "p": 17, "s": "a"}, {"id": "conejo", "t": "El conejo", "p": 19, "s": "a"}, {"id": "leon", "t": "El león", "p": 21, "s": "a"}, {"id": "elefante", "t": "El elefante", "p": 23, "s": "a"}, {"id": "jirafa", "t": "La jirafa", "p": 25, "s": "a"}, {"id": "mono", "t": "El mono", "p": 27, "s": "a"}, {"id": "tortuga", "t": "La tortuga", "p": 29, "s": "a"}, {"id": "pulpo", "t": "El pulpo", "p": 31, "s": "a"}, {"id": "pinguino", "t": "El pingüino", "p": 33, "s": "a"}, {"id": "tractor", "t": "El tractor", "p": 37, "s": "v"}, {"id": "coche", "t": "El coche", "p": 39, "s": "v"}, {"id": "bomberos", "t": "El camión de bomberos", "p": 41, "s": "v"}, {"id": "ambulancia", "t": "La ambulancia", "p": 43, "s": "v"}, {"id": "policia", "t": "El coche de policía", "p": 45, "s": "v"}, {"id": "autobus", "t": "El autobús", "p": 47, "s": "v"}, {"id": "excavadora", "t": "La excavadora", "p": 49, "s": "v"}, {"id": "grua", "t": "La grúa", "p": 51, "s": "v"}, {"id": "tren", "t": "El tren", "p": 53, "s": "v"}, {"id": "avion", "t": "El avión", "p": 55, "s": "v"}, {"id": "barco", "t": "El barco", "p": 57, "s": "v"}, {"id": "helicoptero", "t": "El helicóptero", "p": 59, "s": "v"}, {"id": "cohete", "t": "El cohete", "p": 61, "s": "v"}, {"id": "triceratops", "t": "El triceratops", "p": 65, "s": "d"}, {"id": "trex", "t": "El tiranosaurio", "p": 67, "s": "d"}, {"id": "diplodocus", "t": "El diplodocus", "p": 69, "s": "d"}, {"id": "estegosaurio", "t": "El estegosaurio", "p": 71, "s": "d"}, {"id": "pterodactilo", "t": "El pterodáctilo", "p": 73, "s": "d"}, {"id": "anquilosaurio", "t": "El anquilosaurio", "p": 75, "s": "d"}, {"id": "dinoplaya", "t": "Un día de playa", "p": 77, "s": "d"}, {"id": "dinocumple", "t": "¡Feliz cumpleaños!", "p": 79, "s": "d"}, {"id": "dinofutbol", "t": "¡A jugar al fútbol!", "p": 81, "s": "d"}, {"id": "dinobano", "t": "La hora del baño", "p": 83, "s": "d"}, {"id": "dinodormir", "t": "¡Buenas noches!", "p": 85, "s": "d"}, {"id": "dinotractor", "t": "El dino conduce el tractor", "p": 87, "s": "d"}, {"id": "desfile", "t": "¡Todos juntos!", "p": 89, "s": "d"}];
const SECTIONS = [
  {k:"a", name:"Animales", pages:"págs. 5–34"},
  {k:"v", name:"Vehículos", pages:"págs. 35–62"},
  {k:"d", name:"Dinosaurios", pages:"págs. 63–90"}
];
const COLORS = ["#E63946","#FF8A3D","#FFD60A","#8BD34A","#2A9D8F","#7CC8F2","#2F6FE4","#1E3A8A","#9B5DE5","#FF7EB6","#F7C9A8","#A0522D","#5B3A29","#9AA3AD","#3A3A3A","#FFFFFF"];
const W = 720, H = 960;

/* storage: per-viewer convenience only */
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v); return true }catch(e){ return false } },
  del(k){ try{ localStorage.removeItem(k) }catch(e){} }
};
const key = id => "pm1:" + id;

/* ---------- gallery ---------- */
const tabs = document.getElementById("tabs"), secs = document.getElementById("secs");
function renderGallery(){
  tabs.innerHTML = ""; secs.innerHTML = "";
  SECTIONS.forEach((s,i) => {
    const items = DATA.filter(d => d.s === s.k);
    const painted = items.filter(d => store.get(key(d.id))).length;
    const t = document.createElement("button");
    t.className = "tab"; t.setAttribute("role","tab"); t.id = "tab-"+s.k;
    t.setAttribute("aria-selected", i===0 ? "true":"false");
    t.innerHTML = `${s.name}<small>${painted}/${items.length}</small>`;
    t.onclick = () => { document.getElementById("sec-"+s.k).scrollIntoView({behavior:"smooth",block:"start"}); [...tabs.children].forEach(c=>c.setAttribute("aria-selected", c===t?"true":"false")); };
    tabs.appendChild(t);
    const sec = document.createElement("section");
    sec.className = "sec"; sec.id = "sec-"+s.k;
    sec.innerHTML = `<h2>${s.name} <em>${s.pages}</em></h2>`;
    const g = document.createElement("div"); g.className = "grid";
    items.forEach(d => {
      const saved = store.get(key(d.id));
      const c = document.createElement("button");
      c.className = "card"; c.setAttribute("aria-label", `${d.t}, página ${d.p}`);
      c.innerHTML = `<div class="thumb">${saved?`<img src="${saved}" alt="">`:""}<img class="lines" src="${BASE}mini/${d.id}.png" alt="" loading="lazy"></div>${saved?'<span class="done">¡Pintado!</span>':""}<div class="meta"><b>${d.t}</b><span>Página ${d.p}</span></div>`;
      c.onclick = () => openStudio(d);
      g.appendChild(c);
    });
    sec.appendChild(g); secs.appendChild(sec);
  });
}

/* ---------- studio ---------- */
const home = document.getElementById("home"), studio = document.getElementById("studio");
const paint = document.getElementById("paint"), pctx = paint.getContext("2d", {willReadFrequently:true});
const linesImg = document.getElementById("lines");
const stage = document.getElementById("stage"), stagebox = document.getElementById("stagebox");
let cur = null, wall = null, tool = "fill", color = COLORS[0], brush = 26, undo = [], soundOn = true;

function fitStage(){
  const r = stagebox.getBoundingClientRect();
  const cs = getComputedStyle(stagebox);
  const aw = r.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = r.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 6;
  let w = aw, h = w * H / W;
  if (h > ah){ h = ah; w = h * W / H; }
  stage.style.width = Math.max(120, Math.floor(w)) + "px";
  stage.style.height = Math.max(160, Math.floor(h)) + "px";
}
addEventListener("resize", () => { if (!studio.hidden) fitStage(); });

function loadImage(src){ return new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=src; }); }

async function openStudio(d){
  cur = d; undo = []; updUndo();
  document.getElementById("sTitle").textContent = d.t;
  document.getElementById("sPage").textContent = "Página " + d.p + " de tu libro";
  home.hidden = true; studio.hidden = false; fitStage();
  pctx.fillStyle = "#fff"; pctx.fillRect(0,0,W,H);
  linesImg.src = BASE + d.id + ".png";
  try{
    const li = await loadImage(BASE + d.id + ".png");
    const c = document.createElement("canvas"); c.width=W; c.height=H;
    const x = c.getContext("2d"); x.drawImage(li,0,0,W,H);
    const px = x.getImageData(0,0,W,H).data;
    wall = new Uint8Array(W*H);
    for (let i=0,j=0;i<px.length;i+=4,j++){ if (px[i] < 175) wall[j] = 1; }
    const saved = store.get(key(d.id));
    if (saved){ const si = await loadImage(saved); pctx.drawImage(si,0,0,W,H); }
  }catch(e){ toast("No se pudo cargar el dibujo. Revisa la conexión."); }
  try{ history.pushState({studio:d.id}, ""); pushed = true; }catch(e){ pushed = false; }
}
function closeStudio(){
  persist(); studio.hidden = true; home.hidden = false; renderGallery();
  const card = [...document.querySelectorAll(".card")].find(c => c.getAttribute("aria-label").startsWith(cur.t));
  if (card) card.scrollIntoView({block:"center"});
}
let pushed = false;
document.getElementById("back").onclick = () => { if (pushed){ pushed = false; history.back(); } else closeStudio(); };
addEventListener("popstate", () => { pushed = false; if (!studio.hidden) closeStudio(); });
addEventListener("keydown", e => { if (e.key === "Escape" && !studio.hidden && !document.querySelector(".confirm")) document.getElementById("back").click(); });

let persistT = 0;
function persist(){
  if (!cur) return;
  const blank = undo.length === 0 && !store.get(key(cur.id));
  if (blank) return;
  const s = document.createElement("canvas"); s.width = 360; s.height = 480;
  s.getContext("2d").drawImage(paint,0,0,360,480);
  const full = paint.toDataURL("image/png");
  if (!store.set(key(cur.id), full)) store.set(key(cur.id), s.toDataURL("image/png"));
}
function persistSoon(){ clearTimeout(persistT); persistT = setTimeout(persist, 600); }

/* tools */
const tb = {fill:document.getElementById("tFill"), brush:document.getElementById("tBrush"), erase:document.getElementById("tErase")};
const sizes = document.getElementById("sizes");
function setTool(t){ tool = t; Object.entries(tb).forEach(([k,b])=>b.setAttribute("aria-pressed", k===t?"true":"false")); sizes.hidden = (t === "fill"); }
tb.fill.onclick = ()=>setTool("fill"); tb.brush.onclick = ()=>setTool("brush"); tb.erase.onclick = ()=>setTool("erase");
sizes.querySelectorAll(".size").forEach(b => b.onclick = () => { brush = +b.dataset.s; sizes.querySelectorAll(".size").forEach(o=>o.setAttribute("aria-pressed", o===b?"true":"false")); });

const pal = document.getElementById("pal");
COLORS.forEach((c,i) => {
  const b = document.createElement("button"); b.className = "sw"; b.style.background = c;
  b.setAttribute("aria-label", "Color " + (i+1)); b.setAttribute("aria-pressed", i===0?"true":"false");
  b.onclick = () => { color = c; pal.querySelectorAll(".sw").forEach(o=>o.setAttribute("aria-pressed", o===b?"true":"false")); if (tool==="erase") setTool("fill"); blip(520); };
  pal.appendChild(b);
});

function snap(){ undo.push(pctx.getImageData(0,0,W,H)); if (undo.length > 12) undo.shift(); updUndo(); }
function updUndo(){ document.getElementById("tUndo").disabled = undo.length === 0; }
document.getElementById("tUndo").onclick = () => { if (!undo.length) return; pctx.putImageData(undo.pop(),0,0); updUndo(); persistSoon(); };

const clearBtn = document.getElementById("tClear");
clearBtn.onclick = () => {
  const m = document.createElement("div"); m.className = "confirm";
  m.innerHTML = `<div><p>¿Borrar todo y empezar de nuevo?</p><div class="row"><button class="no">No</button><button class="yes">Sí, borrar</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector(".no").onclick = () => m.remove();
  m.onclick = e => { if (e.target === m) m.remove(); };
  m.querySelector(".yes").onclick = () => { snap(); pctx.fillStyle="#fff"; pctx.fillRect(0,0,W,H); store.del(key(cur.id)); m.remove(); };
};

/* pointer → canvas coords */
function pt(e){ const r = paint.getBoundingClientRect(); return {x:(e.clientX - r.left) * W / r.width, y:(e.clientY - r.top) * H / r.height}; }

function hex(c){ return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)]; }

function flood(x0,y0){
  x0 = Math.floor(x0); y0 = Math.floor(y0);
  if (x0<0||y0<0||x0>=W||y0>=H || !wall) return false;
  let seed = y0*W + x0;
  if (wall[seed]){ // tapped on a line: look for the nearest open pixel
    let best=-1;
    for (let r=1;r<=8 && best<0;r++) for (let dy=-r;dy<=r && best<0;dy++) for (let dx=-r;dx<=r;dx++){
      const x=x0+dx,y=y0+dy; if (x<0||y<0||x>=W||y>=H) continue; const j=y*W+x; if(!wall[j]){best=j;break;}
    }
    if (best<0) return false; seed = best;
  }
  const img = pctx.getImageData(0,0,W,H), a = img.data, [R,G,B] = hex(color);
  const seen = new Uint8Array(W*H), stack = [seed]; seen[seed]=1;
  const filled = [];
  while (stack.length){
    let j = stack.pop(); let x = j % W, y = (j / W) | 0;
    let lx = x; while (lx>0 && !wall[y*W+lx-1] && !seen[y*W+lx-1]) lx--;
    let rx = x; while (rx<W-1 && !wall[y*W+rx+1] && !seen[y*W+rx+1]) rx++;
    for (let xx=lx; xx<=rx; xx++){
      const k=y*W+xx; seen[k]=1; filled.push(k);
      if (y>0){ const u=k-W; if(!seen[u]&&!wall[u]){seen[u]=1;stack.push(u);} }
      if (y<H-1){ const dn=k+W; if(!seen[dn]&&!wall[dn]){seen[dn]=1;stack.push(dn);} }
    }
  }
  // paint, then grow 2px under the outline so no white halo shows at the edges
  let edge = filled;
  for (const k of filled){ const o=k*4; a[o]=R;a[o+1]=G;a[o+2]=B;a[o+3]=255; }
  for (let pass=0; pass<2; pass++){
    const next=[];
    for (const k of edge){ const x=k%W;
      const nb=[x>0?k-1:-1, x<W-1?k+1:-1, k-W, k+W];
      for (const n of nb){ if (n<0||n>=W*H||seen[n]) continue; if (wall[n]){ seen[n]=1; const o=n*4; a[o]=R;a[o+1]=G;a[o+2]=B;a[o+3]=255; next.push(n);} }
    }
    edge = next;
  }
  pctx.putImageData(img,0,0);
  return true;
}

let drawing = false, last = null;
paint.addEventListener("pointerdown", e => {
  e.preventDefault(); unlockAudio();
  const p = pt(e);
  if (tool === "fill"){ snap(); if (flood(p.x,p.y)){ blip(660); persistSoon(); } else undo.pop(), updUndo(); return; }
  snap(); drawing = true; last = p; paint.setPointerCapture(e.pointerId);
  pctx.lineCap = "round"; pctx.lineJoin = "round";
  pctx.strokeStyle = tool === "erase" ? "#FFFFFF" : color; pctx.lineWidth = tool === "erase" ? brush*1.6 : brush;
  pctx.beginPath(); pctx.moveTo(p.x,p.y); pctx.lineTo(p.x+0.1,p.y+0.1); pctx.stroke();
});
paint.addEventListener("pointermove", e => {
  if (!drawing) return; const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of evs){ const p = pt(ev); pctx.beginPath(); pctx.moveTo(last.x,last.y); pctx.lineTo(p.x,p.y); pctx.stroke(); last = p; }
});
const end = () => { if (drawing){ drawing = false; persistSoon(); } };
paint.addEventListener("pointerup", end); paint.addEventListener("pointercancel", end);

/* sound: a soft pop, only after the first touch */
let ac = null;
function unlockAudio(){ if (!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function blip(f){
  if (!soundOn || !ac) return;
  try{ const o=ac.createOscillator(), g=ac.createGain(); o.type="sine"; o.frequency.setValueAtTime(f,ac.currentTime); o.frequency.exponentialRampToValueAtTime(f*1.6,ac.currentTime+.08);
  g.gain.setValueAtTime(.12,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.16); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+.17);}catch(e){}
}
const soundBtn = document.getElementById("sound");
soundOn = store.get("pm1:sound") !== "off";
function updSound(){ soundBtn.setAttribute("aria-pressed", soundOn?"true":"false"); document.getElementById("wave").style.display = soundOn?"":"none"; soundBtn.setAttribute("aria-label", soundOn?"Quitar el sonido":"Poner el sonido"); }
soundBtn.onclick = () => { unlockAudio(); soundOn = !soundOn; store.set("pm1:sound", soundOn?"on":"off"); updSound(); blip(600); };
updSound();

/* save the finished picture */
const embedded = (() => { try { return window.self !== window.top; } catch(e){ return true; } })();
document.getElementById("save").onclick = async () => {
  persist();
  const out = document.createElement("canvas"); out.width = W; out.height = H + 60;
  const x = out.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0,0,out.width,out.height);
  x.drawImage(paint,0,0);
  x.globalCompositeOperation = "multiply"; x.drawImage(linesImg,0,0,W,H); x.globalCompositeOperation = "source-over";
  x.fillStyle = "#1E3A8A"; x.font = "800 26px 'Baloo 2', sans-serif"; x.textAlign = "center";
  x.fillText("Pintado con Los Pintamigos · " + cur.t, W/2, H + 40);
  confetti();
  if (embedded){ toast("¡Qué bonito! Para guardarlo, abre la web del código QR del libro"); return; }
  out.toBlob(async blob => {
    const name = "pintamigos-" + cur.id + ".png";
    try{
      const file = new File([blob], name, {type:"image/png"});
      if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Mi dibujo de Los Pintamigos"}); return; }
    }catch(e){ if (e && e.name === "AbortError") return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    toast("¡Dibujo guardado!");
  }, "image/png");
};

function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("on"), 2600); }

function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confetti"); cv.hidden = false; cv.width = innerWidth; cv.height = innerHeight;
  const x = cv.getContext("2d"), bits = Array.from({length:90}, () => ({x:Math.random()*cv.width, y:-20-Math.random()*cv.height*.4, vx:(Math.random()-.5)*3, vy:2+Math.random()*3, r:4+Math.random()*5, c:COLORS[(Math.random()*10)|0], a:Math.random()*6}));
  let f = 0; (function step(){ x.clearRect(0,0,cv.width,cv.height); bits.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; b.a+=.15; x.fillStyle=b.c; x.beginPath(); x.ellipse(b.x,b.y,b.r,b.r*.6,b.a,0,7); x.fill(); }); if (++f < 120) requestAnimationFrame(step); else cv.hidden = true; })();
}

addEventListener("pagehide", persist);
document.addEventListener("visibilitychange", () => { if (document.hidden) persist(); });
renderGallery();
</script>

<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
